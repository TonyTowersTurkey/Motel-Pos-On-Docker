services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    labels:
      - "motel_stack.component=postgres"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MOTEL_POSTGRES_DB: ${MOTEL_POSTGRES_DB}
      MOTEL_POSTGRES_USER: ${MOTEL_POSTGRES_USER}
      ROOM_POSTGRES_DB: ${ROOM_POSTGRES_DB}
      ROOM_POSTGRES_USER: ${ROOM_POSTGRES_USER}
      ROOM_POSTGRES_PASSWORD: ${ROOM_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    labels:
      - "motel_stack.component=redis"
    restart: unless-stopped
    command: ["redis-server","--save","","--appendonly","no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]

  motel-pos:
    image: ${MOTEL_POS_IMAGE:-ghcr.io/tonytowersturkey/motel-pos:latest}
    labels:
      - "motel_stack.component=motel-pos"
    env_file:
      - ./../motel-pos/motel-pos/.env.production
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${MOTEL_POSTGRES_DB}
      DB_USER: ${MOTEL_POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_REQUIRED: "true"
      SSE_REDIS_URL: redis://redis:6379/2
    ports:
      - "8001:8000"
    volumes:
      - static-data:/app/staticfiles:ro
      - media-data:/app/media
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD","curl","--fail","--silent","--show-error","http://127.0.0.1:8000/api/health/"]

  room-pulse:
    image: ${ROOM_PULSE_IMAGE:-ghcr.io/tonytowersturkey/room-pulse:latest}
    labels:
      - "motel_stack.component=room-pulse"
    env_file:
      - ./../Garage_Door_Detection/Garage_Door_Detection/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${ROOM_POSTGRES_USER}:${ROOM_POSTGRES_PASSWORD}@postgres:5432/${ROOM_POSTGRES_DB}
      REDIS_HOST: redis
    ports:
      - "8002:8000"
    volumes:
      - gd-media:/app/media
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD","curl","--fail","--silent","--show-error","http://127.0.0.1:8000/health/" ]
    command: ["web"]

  room-pulse-snapshot:
    image: ${ROOM_PULSE_IMAGE:-ghcr.io/tonytowersturkey/room-pulse:latest}
    env_file:
      - ./../Garage_Door_Detection/Garage_Door_Detection/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${ROOM_POSTGRES_USER}:${ROOM_POSTGRES_PASSWORD}@postgres:5432/${ROOM_POSTGRES_DB}
      REDIS_HOST: redis
    volumes:
      - gd-media:/app/media
    depends_on:
      - postgres
      - redis
    command: ["snapshot"]
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    labels:
      - "motel_stack.component=caddy"
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      MOTEL_HOSTNAME: ${MOTEL_HOSTNAME}
      ROOMPULSE_HOSTNAME: ${ROOMPULSE_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      motel-pos:
        condition: service_healthy
      room-pulse:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  static-data:
  media-data:
  gd-media:
  caddy-data:
  caddy-config:
