version: '3.9'
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    labels:
      - "motel_stack.component=postgres"
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    labels:
      - "motel_stack.component=redis"
    restart: unless-stopped
    command: ["redis-server","--save","","--appendonly","no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]

  motel-pos:
    image: ${MOTEL_POS_IMAGE:-motel-pos:latest}
    labels:
      - "motel_stack.component=motel-pos"
    env_file:
      - ./../motel-pos/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${MOTEL_POSTGRES_DB}
      DB_USER: ${MOTEL_POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
    volumes:
      - static-data:/app/staticfiles:ro
      - media-data:/app/media
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD","curl","--fail","--silent","--show-error","http://127.0.0.1:8000/api/health/"]

  room-pulse:
    image: ${ROOM_PULSE_IMAGE:-room-pulse:latest}
    labels:
      - "motel_stack.component=room-pulse"
    env_file:
      - ./../Garage_Door_Detection/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://roompulse:${ROOM_POSTGRES_PASSWORD}@postgres:5432/${ROOM_POSTGRES_DB}
      REDIS_HOST: redis
    volumes:
      - gd-media:/app/media:ro
      - gd-models:/app/classificationModels:ro
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD","curl","--fail","--silent","--show-error","http://127.0.0.1:8000/health/" ]
    command: ["web"]

  room-pulse-snapshot:
    image: ${ROOM_PULSE_IMAGE:-room-pulse:latest}
    env_file:
      - ./../Garage_Door_Detection/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://roompulse:${ROOM_POSTGRES_PASSWORD}@postgres:5432/${ROOM_POSTGRES_DB}
      REDIS_HOST: redis
    volumes:
      - gd-media:/app/media:ro
      - gd-models:/app/classificationModels:ro
    depends_on:
      - postgres
      - redis
    command: ["snapshot"]
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    labels:
      - "motel_stack.component=caddy"
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      motel-pos:
        condition: service_healthy
      room-pulse:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  static-data:
  media-data:
  gd-media:
  gd-models:
  caddy-data:
  caddy-config:
