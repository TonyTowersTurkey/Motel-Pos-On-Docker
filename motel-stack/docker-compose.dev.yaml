services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    labels:
      - "motel_stack.component=postgres"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MOTEL_POSTGRES_DB: ${MOTEL_POSTGRES_DB}
      MOTEL_POSTGRES_USER: ${MOTEL_POSTGRES_USER}
      ROOM_POSTGRES_DB: ${ROOM_POSTGRES_DB}
      ROOM_POSTGRES_USER: ${ROOM_POSTGRES_USER}
      ROOM_POSTGRES_PASSWORD: ${ROOM_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-init:
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MOTEL_POSTGRES_DB: ${MOTEL_POSTGRES_DB}
      MOTEL_POSTGRES_USER: ${MOTEL_POSTGRES_USER}
      ROOM_POSTGRES_DB: ${ROOM_POSTGRES_DB}
      ROOM_POSTGRES_USER: ${ROOM_POSTGRES_USER}
      ROOM_POSTGRES_PASSWORD: ${ROOM_POSTGRES_PASSWORD}
    volumes:
      - ./init:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/scripts/create_room_db_and_user.sh"]
    restart: "no"

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    labels:
      - "motel_stack.component=redis"
    command: ["redis-server","--save","","--appendonly","no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]

  motel-pos:
    build:
      context: ./../motel-pos/motel-pos
    env_file:
      - ./../motel-pos/motel-pos/.env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${MOTEL_POSTGRES_DB}
      DB_USER: ${MOTEL_POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
    ports:
      - "8001:8000"
    volumes:
      - ../motel-pos/motel-pos/apps:/app/apps:delegated
      - ../motel-pos/motel-pos/config:/app/config:delegated
      - ../motel-pos/motel-pos/templates:/app/templates:delegated
      - ../motel-pos/motel-pos/manage.py:/app/manage.py:delegated
      - static-data:/app/staticfiles
      - media-data:/app/media
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  room-pulse:
    build:
      context: ./../Garage_Door_Detection/Garage_Door_Detection
    env_file:
      - ./../Garage_Door_Detection/Garage_Door_Detection/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${ROOM_POSTGRES_USER}:${ROOM_POSTGRES_PASSWORD}@postgres:5432/${ROOM_POSTGRES_DB}
      REDIS_HOST: redis
    ports:
      - "8002:8000"
    volumes:
      - ../Garage_Door_Detection/Garage_Door_Detection/app:/app/app:delegated
      - ../Garage_Door_Detection/Garage_Door_Detection/pyproject.toml:/app/pyproject.toml:ro
      - ../Garage_Door_Detection/Garage_Door_Detection/uv.lock:/app/uv.lock:ro
      - gd-media:/app/media
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["web"]

  room-pulse-snapshot:
    build:
      context: ./../Garage_Door_Detection/Garage_Door_Detection
    env_file:
      - ./../Garage_Door_Detection/Garage_Door_Detection/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${ROOM_POSTGRES_USER}:${ROOM_POSTGRES_PASSWORD}@postgres:5432/${ROOM_POSTGRES_DB}
      REDIS_HOST: redis
    volumes:
      - ../Garage_Door_Detection/Garage_Door_Detection/app:/app/app:delegated
      - ../Garage_Door_Detection/Garage_Door_Detection/pyproject.toml:/app/pyproject.toml:ro
      - ../Garage_Door_Detection/Garage_Door_Detection/uv.lock:/app/uv.lock:ro
      - gd-media:/app/media
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["snapshot"]
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    labels:
      - "motel_stack.component=caddy"
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - motel-pos
      - room-pulse

volumes:
  postgres-data:
  redis-data:
  static-data:
  media-data:
  gd-media:
  caddy-data:
  caddy-config:
