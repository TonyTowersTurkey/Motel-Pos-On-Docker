version: '3.9'
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server","--save","","--appendonly","no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]

  motel-pos:
    build:
      context: ./../motel-pos
    env_file:
      - ./../motel-pos/.env.example
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${MOTEL_POSTGRES_DB}
      DB_USER: ${MOTEL_POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
    volumes:
      - ../motel-pos:/app:delegated
      - static-data:/app/staticfiles
      - media-data:/app/media
    depends_on:
      - postgres
      - redis

  room-pulse:
    build:
      context: ./../Garage_Door_Detection
    env_file:
      - ./../Garage_Door_Detection/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://roompulse:${ROOM_POSTGRES_PASSWORD}@postgres:5432/${ROOM_POSTGRES_DB}
      REDIS_HOST: redis
    volumes:
      - ../Garage_Door_Detection:/app:delegated
      - gd-media:/app/media
      - gd-models:/app/classificationModels
    depends_on:
      - postgres
      - redis
    command: ["web"]

  room-pulse-snapshot:
    build:
      context: ./../Garage_Door_Detection
    env_file:
      - ./../Garage_Door_Detection/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://roompulse:${ROOM_POSTGRES_PASSWORD}@postgres:5432/${ROOM_POSTGRES_DB}
      REDIS_HOST: redis
    volumes:
      - ../Garage_Door_Detection:/app:delegated
      - gd-media:/app/media
      - gd-models:/app/classificationModels
    depends_on:
      - postgres
      - redis
    command: ["snapshot"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - motel-pos
      - room-pulse

volumes:
  postgres-data:
  redis-data:
  static-data:
  media-data:
  gd-media:
  gd-models:
  caddy-data:
  caddy-config:
