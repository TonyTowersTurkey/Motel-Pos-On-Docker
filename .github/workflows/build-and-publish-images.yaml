name: Build and publish images

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      OWNER_LOWER: ${{ github.repository_owner == '' && '' || github.repository_owner }}
      MOTEL_POS_IMAGE: ghcr.io/${{ env.OWNER_LOWER }}/motel-pos:latest
      ROOM_PULSE_IMAGE: ghcr.io/${{ env.OWNER_LOWER }}/room-pulse:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        if: ${{ env.GHCR_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Build motel-pos image
        working-directory: ./motel-pos
        run: |
          docker build --pull --tag "$MOTEL_POS_IMAGE" .
          docker save "$MOTEL_POS_IMAGE" -o motel-pos.tar

      - name: Build room-pulse image
        working-directory: ./Garage_Door_Detection
        run: |
          docker build --pull --tag "$ROOM_PULSE_IMAGE" .
          docker save "$ROOM_PULSE_IMAGE" -o room-pulse.tar

      - name: Upload built images
        uses: actions/upload-artifact@v4
        with:
          name: built-images
          path: |
            motel-pos/motel-pos.tar
            Garage_Door_Detection/room-pulse.tar

      - name: Push images to GHCR
        if: ${{ env.GHCR_TOKEN != '' }}
        run: |
          docker push "$MOTEL_POS_IMAGE"
          docker push "$ROOM_PULSE_IMAGE"
