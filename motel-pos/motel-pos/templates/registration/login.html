{% extends "base/base.html" %}

{% block title %}Login — Motel POS{% endblock %}

{% block body %}
<style>
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:min(420px,100%);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:34px}
.login-box h1{font-size:1.6rem;margin-bottom:6px;color:var(--accent)}
.login-box p{color:var(--muted);font-size:.9rem;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:#0f172a;color:var(--text);font-size:1rem}
.field input:focus{border-color:var(--accent);outline:none}
.login-error{color:var(--red);font-size:.86rem;margin-bottom:14px}
</style>

<div class="login-page">
  <form class="login-box" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <h1>Motel POS</h1>
    <p>Sign in to continue.</p>
    {% if form.errors %}
      <div class="login-error">Invalid username or password.</div>
    {% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="{{ form.username.id_for_label }}">Username</label>
      {{ form.username }}
    </div>
    <div class="field">
      <label for="{{ form.password.id_for_label }}">Password</label>
      {{ form.password }}
    </div>
    <button class="btn btn-primary" type="submit" style="width:100%;padding:12px 16px">Sign In</button>
  </form>
</div>
{% endblock %}
